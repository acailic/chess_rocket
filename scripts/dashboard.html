<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Rocket Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --surface3: #1a3a6a;
    --text: #e0e0e0;
    --text-dim: #9a9ab0;
    --accent: #f05572;
    --accent-glow: rgba(240, 85, 114, 0.15);
    --green: #4caf50;
    --light-green: #8bc34a;
    --blue: #2196f3;
    --yellow: #ffc107;
    --orange: #ff9800;
    --red: #f44336;
    /* Spacing scale */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 24px;
    /* Radius scale */
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    /* Shadows */
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    /* Semantic colors */
    --eval-bg: #2a2a3e;
    --highlight-move: rgba(255, 215, 0, 0.35);
    --highlight-check: rgba(255, 0, 54, 0.5);
    --legal-dot: rgba(255, 255, 255, 0.22);
    --legal-ring: rgba(255, 255, 255, 0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  header {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    padding: var(--space-md) var(--space-xl);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--accent);
    box-shadow: var(--shadow-md);
    position: relative;
    z-index: 10;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
  header h1 span { color: var(--accent); }
  .header-stats { display: flex; gap: var(--space-lg); font-size: 0.875rem; color: var(--text-dim); }
  .header-stats span { transition: color 0.2s ease; }
  .header-stats span:hover { color: var(--text); }
  .main {
    display: grid;
    grid-template-columns: minmax(260px, clamp(320px, 42vw, 560px)) 1fr;
    gap: clamp(8px, 1.5vw, 16px);
    padding: clamp(8px, 2vw, 24px);
    max-width: 1280px;
    margin: 0 auto;
    align-items: start;
  }
  .board-col { display: flex; flex-direction: column; gap: 12px; }
  .board-wrapper {
    width: 100%; aspect-ratio: 1;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    max-width: 100%;
  }
  #board { width: 100% !important; height: auto !important; }
  .board-info {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; color: var(--text-dim);
    padding: var(--space-xs) 0;
  }
  .panels { display: flex; flex-direction: column; gap: 12px; }
  .panel {
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    border-left: 3px solid var(--surface2);
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .panel:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .panel h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  /* Opening panel */
  .opening-name { font-size: 1.1rem; font-weight: 600; }
  .opening-eco { color: var(--accent); font-weight: 500; margin-left: 8px; }
  .out-of-book { color: var(--text-dim); font-style: italic; }
  /* Material panel */
  .material-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .material-label { font-size: 0.85rem; }
  .material-value { font-weight: 600; font-size: 1.1rem; }
  .material-diff { font-size: 0.9rem; font-weight: 600; }
  .material-diff.positive { color: var(--green); }
  .material-diff.negative { color: var(--red); }
  .material-diff.even { color: var(--text-dim); }
  .captured { font-size: 1.2rem; letter-spacing: 2px; min-height: 1.5em; }
  /* Eval bar */
  .eval-container { display: flex; align-items: center; gap: var(--space-md); }
  .eval-bar-outer {
    flex: 1; height: clamp(16px, 2.5vh, 22px); background: var(--eval-bg);
    border-radius: var(--radius-lg); overflow: hidden; position: relative;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .eval-bar-inner {
    height: 100%; background: linear-gradient(90deg, #f0f0f0 0%, #ddd 60%, #bbb 100%);
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); border-radius: var(--radius-lg);
  }
  .eval-score { font-weight: 700; font-size: 1rem; min-width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
  /* Status panel */
  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 0.9rem; }
  .status-label { color: var(--text-dim); }
  .status-value { font-weight: 500; }
  .check-indicator { color: var(--yellow); font-weight: 600; }
  .checkmate-indicator { color: var(--red); font-weight: 700; }
  /* Move history */
  .move-history {
    max-height: clamp(140px, 22vh, 240px); overflow-y: auto; scroll-behavior: smooth;
    font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.85rem;
  }
  .move-row { display: flex; align-items: baseline; padding: 2px 0; transition: background 0.15s; border-radius: var(--radius-sm); }
  .move-row:hover { background: rgba(255,255,255,0.03); }
  .move-num { color: var(--text-dim); min-width: 32px; text-align: right; margin-right: 8px; }
  .move-cell { min-width: 80px; display: inline-flex; align-items: baseline; gap: 4px; }
  .move-san { cursor: default; }
  .badge { font-size: 0.7rem; font-weight: 700; border-radius: 3px; padding: 0 3px; }
  .badge-best { color: var(--green); }
  .badge-great { color: var(--light-green); }
  .badge-good { color: var(--blue); }
  .badge-inaccuracy { color: var(--yellow); }
  .badge-mistake { color: var(--orange); }
  .badge-blunder { color: var(--red); }
  /* Game over banner */
  .game-over-banner {
    background: linear-gradient(135deg, var(--surface2) 0%, var(--surface) 100%);
    border: 2px solid var(--accent);
    border-radius: var(--radius-md);
    padding: 0 20px;
    text-align: center;
    opacity: 0;
    transform: translateY(-12px) scale(0.98);
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.4s ease, transform 0.4s ease, max-height 0.4s ease, padding 0.4s ease, margin-top 0.4s ease;
    margin-top: 0;
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .game-over-banner.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    max-height: 200px;
    padding: 20px;
    margin-top: 8px;
  }
  .game-over-result { font-size: 1.3rem; font-weight: 700; }
  .game-over-details { font-size: 0.875rem; color: var(--text-dim); margin-top: var(--space-sm); white-space: pre-line; }
  /* Learning Progress panel */
  .learn-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.9rem; }
  .phase-progress { margin-top: var(--space-sm); }
  .phase-bar-outer { height: 8px; background: var(--eval-bg); border-radius: var(--radius-sm); overflow: hidden; }
  .phase-bar-inner { height: 100%; background: linear-gradient(90deg, var(--light-green), var(--green)); transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); border-radius: var(--radius-sm); }
  .phase-bar-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; text-align: right; }
  /* Waiting state */
  .waiting {
    text-align: center; padding: 60px 20px;
    color: var(--text-dim); font-size: 1.1rem;
  }
  .waiting .pulse { animation: pulse 2s infinite; }
  /* Move input */
  .move-input-bar {
    display: flex; gap: var(--space-sm); align-items: center;
  }
  .move-input-bar input {
    flex: 1; padding: 10px 14px;
    background: var(--bg); border: 1px solid var(--surface2);
    border-radius: var(--radius-md); color: var(--text);
    font-size: 1rem; font-family: 'SF Mono', 'Consolas', monospace;
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .move-input-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .move-input-bar input::placeholder { color: var(--text-dim); }
  .move-input-bar button {
    padding: 10px 20px; background: var(--accent);
    color: #fff; border: none; border-radius: var(--radius-md);
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s;
    box-shadow: 0 2px 8px rgba(240, 85, 114, 0.3);
  }
  .move-input-bar button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(240, 85, 114, 0.4); }
  .move-input-bar button:active { transform: translateY(0) scale(0.98); box-shadow: 0 1px 4px rgba(240, 85, 114, 0.2); }
  .move-input-bar button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .move-input-bar button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .move-status {
    font-size: 0.8rem; margin-top: var(--space-xs); min-height: 1.2em;
    transition: color 0.2s;
  }
  .move-status.ok { color: var(--green); animation: fadeSlideIn 0.25s ease; }
  .move-status.waiting { color: var(--yellow); animation: fadeSlideIn 0.25s ease; }
  .move-status.error { color: var(--red); animation: fadeSlideIn 0.25s ease, shake 0.3s ease 0.25s; }
  /* Last move highlight */
  .highlight-last-move {
    background: var(--highlight-move) !important;
  }
  /* Check indicator */
  .highlight-check {
    background: radial-gradient(
      circle,
      var(--highlight-check) 0%,
      rgba(255, 0, 54, 0.25) 40%,
      rgba(255, 0, 54, 0.08) 65%,
      transparent 100%
    ) !important;
  }
  /* Legal move dot indicator (empty squares) */
  .legal-move-dot {
    position: relative;
  }
  .legal-move-dot::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 26%;
    height: 26%;
    background: var(--legal-dot);
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    animation: dotAppear 0.15s ease;
  }
  /* Legal move capture ring indicator (occupied squares) */
  .legal-move-capture {
    position: relative;
  }
  .legal-move-capture::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    height: 90%;
    border: 5px solid var(--legal-ring);
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    box-sizing: border-box;
    animation: dotAppear 0.15s ease;
  }
  /* Active (clicked) move in move list */
  .active-move {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 1px 4px;
  }
  .move-san.clickable {
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .move-san.clickable:hover {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    color: var(--accent);
  }
  .move-san.clickable:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-radius: var(--radius-sm);
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: var(--radius-sm); }
  ::-webkit-scrollbar-thumb:hover { background: var(--surface3); }

  /* Animations */
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }
  @keyframes dotAppear {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes badgePop {
    0% { transform: scale(0); }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .badge { animation: badgePop 0.25s ease; }

  /* Responsive — fluid first, then breakpoints for layout shifts */

  /* Tablet / narrow desktop: tighten panels */
  @media (max-width: 1024px) {
    .main {
      grid-template-columns: minmax(240px, 1fr) minmax(260px, 340px);
    }
    .panel { padding: 10px 12px; }
    .panel h2 { font-size: 0.7rem; }
    .move-history { max-height: 160px; }
    .opening-name { font-size: 1rem; }
  }

  /* Mobile: single column, board fills width */
  @media (max-width: 768px) {
    .main {
      grid-template-columns: 1fr;
      padding: var(--space-sm);
      gap: var(--space-sm);
    }
    .board-wrapper { max-width: min(90vw, 560px); margin: 0 auto; }
    header {
      padding: var(--space-sm) var(--space-md);
      flex-wrap: wrap;
      gap: var(--space-xs);
    }
    .header-stats { gap: var(--space-sm); font-size: 0.8rem; }
    .move-history { max-height: 180px; }
    .panels { gap: var(--space-sm); }
    .eval-bar-outer { height: 18px; }
  }

  /* Small phone: compact everything */
  @media (max-width: 480px) {
    header h1 { font-size: 1rem; }
    .panel { padding: var(--space-sm) var(--space-md); }
    .status-grid { grid-template-columns: auto 1fr; font-size: 0.85rem; }
    .board-wrapper { max-width: 100%; }
    .move-input-bar input { padding: 8px 10px; font-size: 0.9rem; }
    .move-input-bar button { padding: 8px 14px; font-size: 0.85rem; }
    .material-row { font-size: 0.85rem; }
    .opening-name { font-size: 0.95rem; }
  }

  /* Large desktop: expand board and panels */
  @media (min-width: 1280px) {
    .main {
      grid-template-columns: minmax(360px, 600px) minmax(340px, 440px);
      gap: 24px;
    }
    .move-history { max-height: 260px; }
    .panel { padding: 16px 20px; }
    .panel h2 { font-size: 0.8rem; }
    .opening-name { font-size: 1.15rem; }
  }

  /* Best-move arrow overlay */
  .arrow-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .arrow-overlay svg {
    width: 100%; height: 100%;
  }
  .best-arrow { stroke: #4caf50; stroke-width: 4; fill: none; opacity: 0.8; marker-end: url(#arrowhead); }
  .best-arrow-bg { stroke: #4caf50; stroke-width: 8; fill: none; opacity: 0.3; }

  /* Puzzle panel */
  .puzzle-controls { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
  .puzzle-controls select {
    flex: 1; padding: 6px 10px; background: var(--bg); border: 1px solid var(--surface2);
    border-radius: 4px; color: var(--text); font-size: 0.85rem; min-width: 120px;
  }
  .puzzle-controls button {
    padding: 6px 14px; background: var(--surface2); color: var(--text); border: none;
    border-radius: 4px; font-size: 0.85rem; cursor: pointer;
  }
  .puzzle-controls button:hover { opacity: 0.85; }
  .puzzle-controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .puzzle-info { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.85rem; }
  .puzzle-feedback { margin-top: 6px; font-size: 0.85rem; min-height: 1.5em; padding: 6px; border-radius: 4px; display: none; }
  .puzzle-feedback.correct { display: block; background: rgba(76,175,80,0.15); color: var(--green); }
  .puzzle-feedback.incorrect { display: block; background: rgba(244,67,54,0.15); color: var(--red); }
  .puzzle-feedback.hint { display: block; background: rgba(255,193,7,0.15); color: var(--yellow); }

  /* Blunder warning */
  .blunder-warning {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .blunder-warning-content {
    background: var(--surface); border: 2px solid var(--red); border-radius: 12px;
    padding: 24px; text-align: center; max-width: 360px;
  }
  .blunder-warning-icon { font-size: 2.5rem; margin-bottom: 8px; }
  .blunder-warning-text { font-size: 1rem; margin-bottom: 16px; color: var(--text); }
  .blunder-warning-actions { display: flex; gap: 12px; justify-content: center; }
  .blunder-warning-actions button {
    padding: 8px 20px; border: none; border-radius: 6px; font-size: 0.95rem;
    cursor: pointer; font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <h1><span>Chess Rocket</span> Dashboard</h1>
  <div class="header-stats">
    <span id="session-info">Session #--</span>
    <span id="streak-info">Streak: --</span>
    <button id="puzzle-mode-btn" style="background: var(--surface2); color: var(--text); border: 1px solid var(--surface2); border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 0.85rem;">Puzzles</button>
  </div>
</header>

<div class="main" id="main-content">
  <div class="waiting" id="waiting">
    <p class="pulse">Waiting for game...</p>
    <p style="margin-top:12px;font-size:0.85rem">Start a game via Claude Code to see the board.</p>
  </div>
</div>

<!-- Game layout (hidden until game data arrives) -->
<template id="game-template">
  <div class="board-col">
    <div class="board-wrapper"><div id="board"></div></div>
    <div class="board-info">
      <span id="player-info">Playing as: White</span>
      <span id="engine-info">Engine: 800 Elo</span>
    </div>
    <div class="panel" style="border-left-color: var(--accent);">
      <h2>Your Move</h2>
      <div class="move-input-bar">
        <input type="text" id="move-input" placeholder="e.g. Nf3, e5, O-O" autocomplete="off">
        <button id="move-submit">Move</button>
      </div>
      <div class="move-status" id="move-status"></div>
    </div>
  </div>
  <div class="panels">
    <div class="panel" style="border-left-color: var(--accent);">
      <h2>Opening</h2>
      <div id="opening-display"><span class="out-of-book">Starting position</span></div>
    </div>
    <div class="panel" style="border-left-color: var(--blue);">
      <h2>Material Balance</h2>
      <div class="material-row">
        <span class="material-label">White</span>
        <span class="material-value" id="mat-white">39</span>
      </div>
      <div class="material-row">
        <span class="material-label">Black</span>
        <span class="material-value" id="mat-black">39</span>
      </div>
      <div class="material-row">
        <span class="material-label">Advantage</span>
        <span class="material-diff even" id="mat-diff">Even</span>
      </div>
      <div style="margin-top:6px;">
        <div class="captured" id="captured-white" title="Pieces captured by White"></div>
        <div class="captured" id="captured-black" title="Pieces captured by Black"></div>
      </div>
    </div>
    <div class="panel" style="border-left-color: var(--green);">
      <h2>Evaluation</h2>
      <div class="eval-container">
        <div class="eval-bar-outer">
          <div class="eval-bar-inner" id="eval-bar" style="width:50%"></div>
        </div>
        <span class="eval-score" id="eval-score">0.0</span>
      </div>
    </div>
    <div class="panel" style="border-left-color: var(--yellow);">
      <h2>Game Status</h2>
      <div class="status-grid">
        <span class="status-label">Move</span>
        <span class="status-value" id="move-number">1</span>
        <span class="status-label">Turn</span>
        <span class="status-value" id="turn-display">White</span>
        <span class="status-label">Accuracy (W)</span>
        <span class="status-value" id="acc-white">--</span>
        <span class="status-label">Accuracy (B)</span>
        <span class="status-value" id="acc-black">--</span>
        <span class="status-label">Status</span>
        <span class="status-value" id="check-status">--</span>
      </div>
    </div>
    <div class="panel" style="border-left-color: var(--light-green);">
      <h2>Learning Progress</h2>
      <div class="learn-grid">
        <span class="status-label">Phase</span>
        <span class="status-value" id="learn-phase">--</span>
        <span class="status-label">Lesson</span>
        <span class="status-value" id="learn-lesson">--</span>
        <span class="status-label">Elo</span>
        <span class="status-value" id="learn-elo">--</span>
        <span class="status-label">Streak</span>
        <span class="status-value" id="learn-streak">--</span>
        <span class="status-label">SRS Due</span>
        <span class="status-value" id="learn-srs">--</span>
      </div>
      <div class="phase-progress">
        <div class="phase-bar-outer">
          <div class="phase-bar-inner" id="phase-bar" style="width:0%"></div>
        </div>
        <div class="phase-bar-label" id="phase-bar-label">0% to next phase</div>
      </div>
    </div>

      <div class="game-over-result" id="game-over-result"></div>
      <div class="game-over-details" id="game-over-details"></div>
    </div>

</template>

<div class="blunder-warning" id="blunder-warning" style="display: none;">
  <div class="blunder-warning-content">
    <div class="blunder-warning-icon">⚠</div>
    <div class="blunder-warning-text" id="blunder-warning-text">This move loses significant material!</div>
    <div class="blunder-warning-actions">
      <button id="blunder-confirm" style="background: var(--red);">Play Anyway</button>
      <button id="blunder-cancel" style="background: var(--surface2);">Cancel</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function() {
  'use strict';

  const PIECE_UNICODE = {
    P: '\u2659', N: '\u2658', B: '\u2657', R: '\u2656', Q: '\u2655',
    p: '\u265f', n: '\u265e', b: '\u265d', r: '\u265c', q: '\u265b'
  };

  const BADGE_MAP = {
    best:       { text: '\u2713', cls: 'badge-best' },
    great:      { text: '\u2713', cls: 'badge-great' },
    good:       { text: '\u2022', cls: 'badge-good' },
    inaccuracy: { text: '?!', cls: 'badge-inaccuracy' },
    mistake:    { text: '?',  cls: 'badge-mistake' },
    blunder:    { text: '??', cls: 'badge-blunder' },
  };

  let board = null;
  let lastFen = null;
  let gameActive = false;
  let chessGame = new Chess();
  let moveSubmitting = false;
  let playerColor = 'white';
  let learningProgress = null;
  let curriculumData = null;
  let srsData = null;

  // Track the currently active (clicked) move in the move list
  let activeMoveEl = null;

  function isPlayerTurn() {
    return !gameActive ? false : chessGame.turn() === playerColor[0];
  }

  function initBoard(orientation) {
    playerColor = orientation || 'white';
    const main = document.getElementById('main-content');
    const tmpl = document.getElementById('game-template');
    main.innerHTML = '';
    main.appendChild(tmpl.content.cloneNode(true));
    board = Chessboard('board', {
      position: 'start',
      orientation: orientation || 'white',
      draggable: true,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: function(source, piece, position, orientation) {
        if (chessGame.game_over()) return false;
        if (chessGame.turn() !== playerColor[0]) return false;
        if ((chessGame.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (chessGame.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
        showLegalMoveDots(source);
      },
      onDrop: function(source, target) {
        clearLegalMoveDots();
        const move = chessGame.move({
          from: source,
          to: target,
          promotion: 'q'
        });
        if (move === null) return 'snapback';
        submitMove(move.san);
      },
      onSnapEnd: function() {
        clearLegalMoveDots();
        board.position(chessGame.fen());
      }
    });
    window.addEventListener('resize', () => board.resize());
    gameActive = true;

    // Load learning progress data
    loadLearningProgress();

    // Wire up text input
    const input = document.getElementById('move-input');
    const btn = document.getElementById('move-submit');
    btn.addEventListener('click', () => submitTextInput());
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitTextInput(); });
  }

  function submitTextInput() {
    const input = document.getElementById('move-input');
    const san = input.value.trim();
    if (!san) return;
    // Validate with chess.js
    const move = chessGame.move(san);
    if (move === null) {
      setMoveStatus('Invalid move: ' + san, 'error');
      return;
    }
    submitMove(move.san);
    input.value = '';
  }

  async function submitMove(san) {
    if (moveSubmitting) return;
    moveSubmitting = true;
    setMoveStatus('Sending move...', 'waiting');
    const btn = document.getElementById('move-submit');
    if (btn) btn.disabled = true;

    try {
      const resp = await fetch('/api/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ move: san })
      });
      const data = await resp.json();
      if (data.ok) {
        setMoveStatus('Move sent: ' + san + ' (waiting for engine...)', 'ok');
      } else {
        setMoveStatus('Error: ' + (data.error || 'unknown'), 'error');
        // Undo the chess.js move since it wasn't accepted
        chessGame.undo();
        board.position(chessGame.fen());
      }
    } catch (e) {
      setMoveStatus('Connection error', 'error');
      chessGame.undo();
      board.position(chessGame.fen());
    }

    moveSubmitting = false;
    if (btn) btn.disabled = false;
  }

  function setMoveStatus(text, cls) {
    const el = document.getElementById('move-status');
    if (!el) return;
    el.textContent = text;
    el.className = 'move-status ' + (cls || '');
  }

  function capturedToUnicode(pieces, color) {
    if (!pieces || !pieces.length) return '';
    return pieces.map(p => {
      const key = color === 'white' ? p.toLowerCase() : p.toUpperCase();
      // White captures black pieces (lowercase), black captures white pieces (uppercase)
      // "captured by white" means those are black pieces
      const displayKey = color === 'white' ? p.toLowerCase() : p;
      return PIECE_UNICODE[displayKey] || p;
    }).join(' ');
  }

  // --- Learning Progress functions ---

  async function fetchLearningProgress() {
    try {
      const resp = await fetch('/api/progress');
      if (!resp.ok) return null;
      return await resp.json();
    } catch (e) {
      return null;
    }
  }

  async function fetchSRSData() {
    try {
      const resp = await fetch('/api/srs');
      if (!resp.ok) return null;
      return await resp.json();
    } catch (e) {
      return null;
    }
  }

  async function fetchCurriculumData() {
    try {
      const resp = await fetch('/api/curriculum');
      if (!resp.ok) return null;
      return await resp.json();
    } catch (e) {
      return null;
    }
  }

  function updateLearningProgressPanel(progress, srsData, curriculumData) {
    const phaseEl = document.getElementById('learn-phase');
    const lessonEl = document.getElementById('learn-lesson');
    const eloEl = document.getElementById('learn-elo');
    const streakEl = document.getElementById('learn-streak');
    const srsEl = document.getElementById('learn-srs');
    const phaseBar = document.getElementById('phase-bar');
    const phaseBarLabel = document.getElementById('phase-bar-label');

    if (!progress) {
      phaseEl.textContent = '--';
      lessonEl.textContent = '--';
      eloEl.textContent = '--';
      streakEl.textContent = '--';
      srsEl.textContent = '--';
      if (phaseBar) phaseBar.style.width = '0%';
      if (phaseBarLabel) phaseBarLabel.textContent = '0% to next phase';
      return;
    }

    // Update basic metrics
    const dueCount = srsData ? srsData.due_count : 0;
    srsEl.textContent = dueCount;
    eloEl.textContent = progress.estimated_elo || '--';
    streakEl.textContent = progress.current_streak || 0;

    // Highlight streak if >= 3
    if (progress.current_streak >= 3) {
      streakEl.style.color = 'var(--accent)';
    } else {
      streakEl.style.color = '';
    }

    // Update curriculum info
    if (curriculumData && curriculumData.phases) {
      const currentPhase = progress.current_phase || 1;
      const currentLesson = progress.current_lesson || '1.1';

      const phaseInfo = curriculumData.phases.find(p => p.title.includes('Phase ' + currentPhase));
      if (phaseInfo) {
        phaseEl.textContent = 'Phase ' + currentPhase;

        // Find the current lesson
        const lessonInfo = phaseInfo.lessons.find(l => l.number === currentLesson);
        if (lessonInfo) {
          lessonEl.textContent = lessonInfo.title;
        } else {
          lessonEl.textContent = 'Lesson ' + currentLesson;
        }

        // Update phase progress bar
        if (phaseBar && phaseBarLabel) {
          const totalLessons = phaseInfo.lessons.length;
          const currentLessonNum = parseInt(currentLesson.split('.')[1]) || 1;
          const progressPct = Math.round((currentLessonNum / totalLessons) * 100);
          phaseBar.style.width = progressPct + '%';
          phaseBarLabel.textContent = progressPct + '% through Phase ' + currentPhase;
        }
      } else {
        phaseEl.textContent = 'Phase ' + currentPhase;
        lessonEl.textContent = 'Lesson ' + currentLesson;
        if (phaseBar) phaseBar.style.width = '0%';
        if (phaseBarLabel) phaseBarLabel.textContent = '0% to next phase';
      }
    } else {
      phaseEl.textContent = 'Phase ' + (progress.current_phase || 1);
      lessonEl.textContent = 'Lesson ' + (progress.current_lesson || '1.1');
      if (phaseBar) phaseBar.style.width = '0%';
      if (phaseBarLabel) phaseBarLabel.textContent = '0% to next phase';
    }
  }

  async function loadLearningProgress() {
    const [progress, srsData, curriculumData] = await Promise.all([
      fetchLearningProgress(),
      fetchSRSData(),
      fetchCurriculumData()
    ]);
    updateLearningProgressPanel(progress, srsData, curriculumData);
  }

  // --- Panel Updates ---

  function updatePanels(state) {
    // Header
    document.getElementById('session-info').textContent = 'Session #' + (state.session_number || 1);
    const streak = state.streak || 0;
    document.getElementById('streak-info').textContent = 'Streak: ' + streak + (streak >= 3 ? ' \uD83D\uDD25' : '');

    // Board info
    document.getElementById('player-info').textContent = 'Playing as: ' + capitalize(state.player_color || 'white');
    document.getElementById('engine-info').textContent = 'Engine: ' + (state.target_elo || 800) + ' Elo';

    // Opening
    const openingEl = document.getElementById('opening-display');
    const op = state.current_opening;
    if (op && op.name) {
      openingEl.innerHTML = '<span class="opening-name">' + esc(op.name) + '</span>' +
        (op.eco ? '<span class="opening-eco">' + esc(op.eco) + '</span>' : '');
    } else {
      const moveCount = (state.move_list || []).length;
      openingEl.innerHTML = '<span class="out-of-book">' + (moveCount > 0 ? 'Out of book' : 'Starting position') + '</span>';
    }

    // Material
    const mat = state.material || { white: 0, black: 0 };
    document.getElementById('mat-white').textContent = mat.white;
    document.getElementById('mat-black').textContent = mat.black;
    const diff = mat.white - mat.black;
    const diffEl = document.getElementById('mat-diff');
    if (diff > 0) {
      diffEl.textContent = '+' + diff + ' White';
      diffEl.className = 'material-diff positive';
    } else if (diff < 0) {
      diffEl.textContent = diff + ' Black';
      diffEl.className = 'material-diff negative';
    } else {
      diffEl.textContent = 'Even';
      diffEl.className = 'material-diff even';
    }

    // Captured pieces
    const cap = state.captured_pieces || { white: [], black: [] };
    document.getElementById('captured-white').innerHTML =
      cap.white.length ? '\u25B3 ' + capturedToUnicode(cap.white, 'white') : '';
    document.getElementById('captured-black').innerHTML =
      cap.black.length ? '\u25BD ' + capturedToUnicode(cap.black, 'black') : '';

    // Eval bar
    const evalScore = state.eval_score;
    const evalEl = document.getElementById('eval-score');
    const barEl = document.getElementById('eval-bar');
    if (evalScore != null) {
      const clamped = Math.max(-10, Math.min(10, evalScore));
      const pct = Math.round(((clamped + 10) / 20) * 100);
      barEl.style.width = pct + '%';
      evalEl.textContent = (evalScore > 0 ? '+' : '') + evalScore.toFixed(1);
    } else {
      barEl.style.width = '50%';
      evalEl.textContent = '--';
    }

    // Game status
    const fen = state.fen || '';
    const parts = fen.split(' ');
    const turnColor = parts[1] === 'b' ? 'Black' : 'White';
    const fullmove = parts[5] || '1';
    document.getElementById('move-number').textContent = fullmove;
    document.getElementById('turn-display').textContent = turnColor + ' to play';

    const acc = state.accuracy || { white: 0, black: 0 };
    document.getElementById('acc-white').textContent =
      acc.white ? acc.white.toFixed(1) + '%' : '--';
    document.getElementById('acc-black').textContent =
      acc.black ? acc.black.toFixed(1) + '%' : '--';

    const statusEl = document.getElementById('check-status');
    if (state.is_checkmate) {
      statusEl.innerHTML = '<span class="checkmate-indicator">Checkmate!</span>';
    } else if (state.is_stalemate) {
      statusEl.innerHTML = '<span class="check-indicator">Stalemate</span>';
    } else if (state.is_check) {
      statusEl.innerHTML = '<span class="check-indicator">Check!</span>';
    } else {
      statusEl.textContent = 'In progress';
    }

    // Move history with annotations (clickable moves)
    const moveList = state.move_list || [];
    const annotations = state.move_annotations || [];
    const annotMap = {};
    annotations.forEach(a => { annotMap[a.ply] = a; });

    const historyEl = document.getElementById('move-history');
    let html = '';
    for (let i = 0; i < moveList.length; i += 2) {
      const moveNum = Math.floor(i / 2) + 1;
      const whiteMove = moveList[i];
      const blackMove = i + 1 < moveList.length ? moveList[i + 1] : '';

      html += '<div class="move-row">';
      html += '<span class="move-num">' + moveNum + '.</span>';
      html += renderMoveCell(whiteMove, annotMap[i], i);
      if (blackMove) {
        html += renderMoveCell(blackMove, annotMap[i + 1], i + 1);
      }
      html += '</div>';
    }
    historyEl.innerHTML = html;
    historyEl.scrollTop = historyEl.scrollHeight;

    // Game over banner
    const banner = document.getElementById('game-over');
    if (state.is_game_over && state.result) {
      banner.classList.add('visible');
      let resultText = state.result;
      if (state.result === '1-0') resultText = '1-0 \u2014 White wins';
      else if (state.result === '0-1') resultText = '0-1 \u2014 Black wins';
      else if (state.result === '1/2-1/2') resultText = '\u00BD-\u00BD \u2014 Draw';
      document.getElementById('game-over-result').textContent = resultText;

      const totalMoves = Math.ceil(moveList.length / 2);
      const playerClr = state.player_color || 'white';
      const playerAcc = acc[playerClr] || 0;

      // Count move classifications
      let bestMoves = 0, greatMoves = 0, goodMoves = 0;
      let inaccuracies = 0, mistakes = 0, blunders = 0;
      annotations.forEach(a => {
        if (a.classification === 'best') bestMoves++;
        else if (a.classification === 'great') greatMoves++;
        else if (a.classification === 'good') goodMoves++;
        else if (a.classification === 'inaccuracy') inaccuracies++;
        else if (a.classification === 'mistake') mistakes++;
        else if (a.classification === 'blunder') blunders++;
      });

      const totalPlayerMoves = bestMoves + greatMoves + goodMoves + inaccuracies + mistakes + blunders;
      const accuracyPct = totalPlayerMoves > 0 ? playerAcc : 0;

      // Build detailed game-over message
      let details = 'Accuracy: ' + accuracyPct.toFixed(1) + '% \u00B7 ' + totalMoves + ' moves';

      // Add mistakes breakdown line
      if (bestMoves > 0 || greatMoves > 0 || goodMoves > 0 || inaccuracies > 0 || mistakes > 0 || blunders > 0) {
        details += '\nMoves: ';
        let moveParts = [];
        if (bestMoves > 0) moveParts.push(bestMoves + ' best');
        if (greatMoves > 0) moveParts.push(greatMoves + ' great');
        if (goodMoves > 0) moveParts.push(goodMoves + ' good');
        if (inaccuracies > 0) moveParts.push(inaccuracies + ' inacc.');
        if (mistakes > 0) moveParts.push(mistakes + ' mistake' + (mistakes > 1 ? 's' : ''));
        if (blunders > 0) moveParts.push(blunders + ' blunder' + (blunders > 1 ? 's' : ''));
        details += moveParts.join(', ');
      }

      // Add teaching tip based on worst mistake classification
      let teachingTip = '';
      if (blunders > 0) {
        teachingTip = 'Focus: Review tactical patterns to avoid blunders';
      } else if (mistakes > 0) {
        teachingTip = 'Focus: Practice calculating 2-3 moves ahead';
      } else if (inaccuracies > 0) {
        teachingTip = 'Focus: Look for stronger alternatives before moving';
      } else {
        teachingTip = 'Great game! Keep up the solid play';
      }
      details += '\n' + teachingTip;

      // Add total puzzles solved from progress data
      if (learningProgress && learningProgress.total_puzzles_solved !== undefined) {
        details += '\nPuzzles solved: ' + learningProgress.total_puzzles_solved;
      }

      document.getElementById('game-over-details').textContent = details;

      // Refresh learning progress after game ends
      loadLearningProgress();
    } else {
      banner.classList.remove('visible');
    }
  }

  function renderMoveCell(san, annot, plyIndex) {
    let badgeHtml = '';
    if (annot && annot.classification) {
      const b = BADGE_MAP[annot.classification];
      if (b) {
        badgeHtml = '<span class="badge ' + b.cls + '">' + b.text + '</span>';
      }
    }
    // Make moves clickable with onclick handler for visual highlighting
    return '<span class="move-cell"><span class="move-san clickable" onclick="onMoveClick(this)">' +
      esc(san) + '</span>' + badgeHtml + '</span>';
  }

  // --- Visual Teaching Enhancements ---

  /**
   * Clear all board square highlights (last-move, check, legal-move dots).
   */
  function clearHighlights() {
    $('.highlight-last-move, .highlight-check, .legal-move-dot, .legal-move-capture')
      .removeClass('highlight-last-move highlight-check legal-move-dot legal-move-capture');
  }

  /**
   * Highlight the from/to squares of the last move (UCI format like "e2e4").
   */
  function highlightLastMove(lastMove) {
    if (!lastMove || lastMove.length < 4) return;
    var from = lastMove.substring(0, 2);
    var to = lastMove.substring(2, 4);
    var $from = $('.square-' + from);
    var $to = $('.square-' + to);
    if ($from.length) $from.addClass('highlight-last-move');
    if ($to.length) $to.addClass('highlight-last-move');
  }

  /**
   * Find the king square that is in check from the FEN position.
   * chess.js 0.10.3 does not expose this directly, so we parse the FEN.
   */
  function findKingInCheck(fen) {
    if (!fen) return null;
    var parts = fen.split(' ');
    var turn = parts[1]; // 'w' or 'b' -- the side to move (the one in check)
    var piecePlacement = parts[0];
    // Build an 8x8 board array from FEN
    var rows = piecePlacement.split('/');
    var boardArr = [];
    for (var r = 0; r < 8; r++) {
      var row = [];
      for (var c = 0; c < rows[r].length; c++) {
        var ch = rows[r][c];
        if (ch >= '1' && ch <= '8') {
          for (var e = 0; e < parseInt(ch); e++) row.push(null);
        } else {
          row.push(ch);
        }
      }
      boardArr.push(row);
    }
    // Find the king of the side to move (the one in check)
    var kingChar = turn === 'w' ? 'K' : 'k';
    for (var r2 = 0; r2 < 8; r2++) {
      for (var c2 = 0; c2 < 8; c2++) {
        if (boardArr[r2][c2] === kingChar) {
          var file = String.fromCharCode(97 + c2); // 'a'-'h'
          var rank = String(8 - r2);               // '8'-'1'
          return file + rank;
        }
      }
    }
    return null;
  }

  /**
   * Highlight the king's square with a red glow when in check.
   */
  function highlightCheck(isCheck, fen) {
    if (!isCheck) return;
    var kingSquare = findKingInCheck(fen);
    if (kingSquare) {
      var $sq = $('.square-' + kingSquare);
      if ($sq.length) $sq.addClass('highlight-check');
    }
  }

  /**
   * Apply all board highlights based on the current game state.
   * Called from poll() after the board position is updated.
   */
  function applyHighlights(state) {
    clearHighlights();
    highlightLastMove(state.last_move);
    highlightCheck(state.is_check, state.fen);
  }

  /**
   * Show legal move indicators on the board for the piece being dragged.
   * Uses chess.js verbose moves to find target squares from the source.
   */
  function showLegalMoveDots(source) {
    clearLegalMoveDots();
    if (!chessGame || chessGame.game_over()) return;
    var moves = chessGame.moves({ verbose: true });
    var targetSquares = {};
    for (var i = 0; i < moves.length; i++) {
      if (moves[i].from === source) {
        targetSquares[moves[i].to] = true;
      }
    }
    var keys = Object.keys(targetSquares);
    for (var j = 0; j < keys.length; j++) {
      var sq = keys[j];
      var $sq = $('.square-' + sq);
      // If the target square has a piece on it, show capture ring; otherwise show dot
      if ($sq.find('img').length > 0) {
        $sq.addClass('legal-move-capture');
      } else {
        $sq.addClass('legal-move-dot');
      }
    }
  }

  /**
   * Remove legal move dot indicators from the board.
   */
  function clearLegalMoveDots() {
    $('.legal-move-dot, .legal-move-capture').removeClass('legal-move-dot legal-move-capture');
  }

  // Expose onMoveClick globally so inline onclick handlers can call it
  window.onMoveClick = function(el) {
    if (activeMoveEl) {
      activeMoveEl.classList.remove('active-move');
    }
    el.classList.add('active-move');
    activeMoveEl = el;
  };

  // --- Utility ---

  function updateLearningPanel(curriculum, srsData) {
    if (!curriculum) {
      // Show defaults if no curriculum data
      document.getElementById('learn-phase').textContent = '--';
      document.getElementById('learn-lesson').textContent = '--';
      document.getElementById('learn-elo').textContent = '--';
      document.getElementById('learn-streak').textContent = '--';
      document.getElementById('learn-srs').textContent = '--';
      document.getElementById('phase-bar').style.width = '0%';
      document.getElementById('phase-bar-label').textContent = '0% to next phase';
      return;
    }

    // Set phase and lesson
    const phaseName = curriculum.phase_name || 'Unknown Phase';
    const lessonTitle = curriculum.lesson_title || 'Unknown Lesson';
    document.getElementById('learn-phase').textContent = phaseName + ': ' + lessonTitle;
    document.getElementById('learn-lesson').textContent = 'Lesson ' + (curriculum.current_lesson || '--');

    // Set Elo with milestone
    const currentElo = curriculum.estimated_elo || '--';
    const nextMilestone = curriculum.next_milestone_elo || '--';
    document.getElementById('learn-elo').textContent = currentElo + ' / ' + nextMilestone;

    // Set streak with fire emoji for streaks >= 3
    const streak = curriculum.current_streak || 0;
    document.getElementById('learn-streak').textContent = streak + (streak >= 3 ? ' \uD83D\uDD25' : '');

    // Set SRS due count with yellow color if > 0
    const srsDue = srsData && srsData.due_count ? srsData.due_count : 0;
    const srsEl = document.getElementById('learn-srs');
    srsEl.textContent = srsDue;
    srsEl.style.color = srsDue > 0 ? 'var(--yellow)' : '';

    // Update phase progress bar
    const progressPct = curriculum.progress_pct || 0;
    document.getElementById('phase-bar').style.width = progressPct + '%';
    document.getElementById('phase-bar-label').textContent = progressPct + '% to next phase';
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // --- Polling loop ---

  async function poll() {
    try {
      const resp = await fetch('/api/game');
      if (!resp.ok) return;
      const state = await resp.json();
      if (!state || !state.fen) return;

      if (!gameActive) {
        initBoard(state.player_color || 'white');
      }

      if (state.fen !== lastFen) {
        board.position(state.fen, true);
        // Keep chess.js in sync with server state
        try { chessGame.load(state.fen); } catch(e) {}
        lastFen = state.fen;
        // Apply visual highlights (last move, check) after position update
        applyHighlights(state);
        // Clear move status once engine has responded
        if (moveSubmitting) {
          setMoveStatus('', '');
          moveSubmitting = false;
        }
      }

      // Check orientation
      const expectedOrientation = state.player_color === 'black' ? 'black' : 'white';
      if (board.orientation() !== expectedOrientation) {
        board.orientation(expectedOrientation);
      }

      updatePanels(state);

      // Fetch curriculum and SRS data
      try {
        const [curriculumResp, srsResp] = await Promise.all([
          fetch('/api/curriculum'),
          fetch('/api/srs')
        ]);

        if (curriculumResp.ok) {
          const curriculum = await curriculumResp.json();
          curriculumData = curriculum;
        }

        if (srsResp.ok) {
          const srs = await srsResp.json();
          srsData = srs;
        }

        // Update learning panel with fetched data
        updateLearningPanel(curriculumData, srsData);
      } catch (e) {
        // Gracefully handle API errors - show defaults
        updateLearningPanel(null, null);
      }
    } catch (e) {
      // Server might be down, just retry
    }
  }

  setInterval(poll, 500);
  poll();
})();
</script>
